[package]
name = "sovereign-swap"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "AGPL-3.0-or-later"
description = "Peer-to-peer atomic swaps between BTC and xBTC (Bitcoin Blake2b)"
publish = false

[dependencies]
bitcoin = { version = "=0.32.102", default-features = false, features = ["std", "serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
# Post-quantum primitives: libcrux is formally verified (design 0005). Pinned exactly.
libcrux-ml-kem = "=0.0.11"
libcrux-ml-dsa = "=0.0.11"
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["static_secrets"] }
aes-gcm = "=0.11.1"
hkdf = "=0.13.0"
sha2 = "=0.11.1"
serde_json = "=1.0.154"
