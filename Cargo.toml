[package]
name = "sovereign-swap"
version = "0.5.0"
edition = "2021"
rust-version = "1.80"
license = "AGPL-3.0-or-later"
description = "Peer-to-peer atomic swaps between BTC and xBTC (Bitcoin Blake2b)"
publish = false

[dependencies]
bitcoin = { version = "=0.32.102", default-features = false, features = ["std", "serde", "base64"] }
# Already in the tree via bitcoin; promoted to a direct, pinned dep for silent payment (BIP352)
# address bech32m encode/decode. No new crate enters the lockfile.
bech32 = { version = "=0.11.1", default-features = false, features = ["alloc"] }
serde = { version = "=1.0.229", features = ["derive"] }
# Post-quantum primitives: libcrux is formally verified (design 0005). Pinned exactly.
libcrux-ml-kem = "=0.0.11"
libcrux-ml-dsa = "=0.0.11"
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["static_secrets"] }
aes-gcm = "=0.11.1"
hkdf = "=0.13.0"
sha2 = "=0.11.1"
# WebSocket client for Nostr relays (M3b-3), no TLS/async: Tor-first ws:// over a SOCKS5 tunnel.
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
serde_json = "=1.0.154"
# TLS for StartOS node RPC, HTTPS with a self-signed Root CA (design 0011). Pure Rust, no OpenSSL;
# the audited `ring` provider (no aws-lc-rs, so no cmake/C toolchain). The trust store holds only the
# user's CA, no bundled public roots: a deliberate sovereign property.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "=2.2.0"

[dev-dependencies]
# Mints a throwaway CA + localhost leaf (with an IP SAN) in-process for the TLS transport tests, so
# no certificate or key material is committed to this public repo. `ring` provider, no cmake/C.
rcgen = { version = "=0.13.2", default-features = false, features = ["pem", "ring"] }

[features]
# Exposes internal parsers (HTTP reader) to the fuzz targets only; never set in a normal build.
fuzzing = []
