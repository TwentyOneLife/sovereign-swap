<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 687 98" width="687" role="img" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<style>:root{--bg:#f6f6f7;--fg:#2c2c34;--brd:#e2e2e3}@media (prefers-color-scheme:dark){:root{--bg:#161618;--fg:#d7d7db;--brd:#2e2e32}}rect.p{fill:var(--bg);stroke:var(--brd)}text{fill:var(--fg)}rect.a{fill:#F7931A}</style>
<rect class="p" x="0.5" y="0.5" width="686" height="97" rx="8"/>
<rect class="a" x="0" y="0" width="687" height="3" rx="1.5"/>
<text x="16" y="32.5" font-size="15" xml:space="preserve">  1. Browse the market in the GUI (offers discovered over your relays).</text>
<text x="16" y="54.5" font-size="15" xml:space="preserve">  2. Pick an offer, enter how much of it to take (full or partial if allowed).</text>
<text x="16" y="76.5" font-size="15" xml:space="preserve">  3. Take.  ──►  a bid is sent to the maker; the swap begins.</text>
