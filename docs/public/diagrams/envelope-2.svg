<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 578 472" width="578" role="img" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<style>:root{--bg:#f6f6f7;--fg:#2c2c34;--brd:#e2e2e3}@media (prefers-color-scheme:dark){:root{--bg:#161618;--fg:#d7d7db;--brd:#2e2e32}}rect.p{fill:var(--bg);stroke:var(--brd)}text{fill:var(--fg)}rect.a{fill:#F7931A}</style>
<rect class="p" x="0.5" y="0.5" width="577" height="471" rx="8"/>
<rect class="a" x="0" y="0" width="578" height="3" rx="1.5"/>
<text x="16" y="32.5" font-size="15" xml:space="preserve">   plaintext Message (JSON)</text>
<text x="16" y="54.5" font-size="15" xml:space="preserve">          │</text>
<text x="16" y="76.5" font-size="15" xml:space="preserve">          ▼</text>
<text x="16" y="98.5" font-size="15" xml:space="preserve">   ┌──────────────────┐   hybrid signature over the payload</text>
<text x="16" y="120.5" font-size="15" xml:space="preserve">   │  sign            │   = Schnorr (secp256k1)  +  ML-DSA-87</text>
<text x="16" y="142.5" font-size="15" xml:space="preserve">   └────────┬─────────┘   (valid only if BOTH verify)</text>
<text x="16" y="164.5" font-size="15" xml:space="preserve">            ▼</text>
<text x="16" y="186.5" font-size="15" xml:space="preserve">   signed payload</text>
<text x="16" y="208.5" font-size="15" xml:space="preserve">            │</text>
<text x="16" y="230.5" font-size="15" xml:space="preserve">            ▼</text>
<text x="16" y="252.5" font-size="15" xml:space="preserve">   ┌──────────────────┐   shared secret from TWO key agreements:</text>
<text x="16" y="274.5" font-size="15" xml:space="preserve">   │  derive key      │     X25519   (classical)</text>
<text x="16" y="296.5" font-size="15" xml:space="preserve">   │  (HKDF)          │   + ML-KEM-1024 (post-quantum)</text>
<text x="16" y="318.5" font-size="15" xml:space="preserve">   └────────┬─────────┘   combined with HKDF into one AES-256 key</text>
<text x="16" y="340.5" font-size="15" xml:space="preserve">            ▼</text>
<text x="16" y="362.5" font-size="15" xml:space="preserve">   ┌──────────────────┐</text>
<text x="16" y="384.5" font-size="15" xml:space="preserve">   │  encrypt         │   AES-256-GCM (authenticated encryption)</text>
<text x="16" y="406.5" font-size="15" xml:space="preserve">   └────────┬─────────┘</text>
<text x="16" y="428.5" font-size="15" xml:space="preserve">            ▼</text>
<text x="16" y="450.5" font-size="15" xml:space="preserve">   sealed envelope  ──►  carried as the Nostr event content (hex)</text>
</svg>