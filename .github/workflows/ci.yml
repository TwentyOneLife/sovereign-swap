name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch and verify Bitcoin Core and Knots BLAKE2b
        run: scripts/fetch-nodes.sh "$RUNNER_TEMP/nodes" >> "$GITHUB_ENV"
      - name: Format, clippy, unit and regtest tests
        run: scripts/test-in-container.sh

  no-internal-refs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Guard against infra leakage
        run: |
          if git grep -nIE '192\.168\.[0-9]|(^|[^0-9.])10(\.[0-9]{1,3}){3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]|/home/|/data/|[a-z2-7]{16,56}\.onion' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::Internal infra reference (IP / local path / onion) found in a tracked file."
            exit 1
          fi
          echo "no internal refs"
